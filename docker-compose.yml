x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── INFRAESTRUTURA ────────────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-broker
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    deploy:
      resources:
        limits:
          memory: ${MOSQUITTO_MEMORY_LIMIT:-128M}
          cpus: '0.5'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cmdb_iot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
          cpus: '1.0'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-128M}
          cpus: '0.25'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  redis-streams:
    image: redis:7-alpine
    container_name: iot-redis-streams
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_streams_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          # maxmemory interno de 512mb + overhead do redis
          memory: ${REDIS_STREAMS_MEMORY_LIMIT:-640M}
          cpus: '0.5'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: iot-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment: 
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-256M}
          cpus: '0.5'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: mackenzie
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    deploy:
      resources:
        limits:
          memory: ${INFLUXDB_MEMORY_LIMIT:-512M}
          cpus: '0.5'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  # ── IDENTIDADE ────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: iot-keycloak
    # renderiza template do realm com secrets do env
    # depois delega pro kc.sh. --import-realm cria o realm no primeiro boot
    # e ignora silenciosamente nos boots seguintes se ja existir.
    entrypoint: ["/opt/keycloak/data/import/import-entrypoint.sh"]
    # import ja rodou como fase separada no entrypoint; command so sobe o server
    command: ["start-dev"]
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixa o hostname que Keycloak usa pra montar URLs (issuer, JWKS, redirects).
      KC_HOSTNAME: http://${HOST_IP}:8080
      KC_HOSTNAME_STRICT: "false"
      # Habilita endpoint /health/{ready,live,started} na porta 9000 (mgmt).
      KC_HEALTH_ENABLED: "true"
      # Secrets injetados no template do realm pelo entrypoint
      GOVAPI_CLIENT_SECRET: ${GOVAPI_CLIENT_SECRET}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET}
      AGENT_MQTT_CLIENT_SECRET: ${AGENT_MQTT_CLIENT_SECRET}
      HOST_IP: ${HOST_IP}
      # Porta do SPA (redirect uris do iot-bff). Default 5173 dev, override 8090 no lab.
      SPA_HOST_PORT: ${SPA_HOST_PORT:-5173}
      # Senha do user "admin" do IOT-REALM criado no bootstrap do template.
      # Login: admin / <IOT_ADMIN_PASSWORD>. Ele traz ROLE_ADMIN via iot-bff.
      IOT_ADMIN_PASSWORD: ${IOT_ADMIN_PASSWORD:-admin}
    volumes:
      # Writable pra que o entrypoint escreva o JSON renderizado (iot-realm.json)
       - ./deploy/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Verifica o discovery endpoint do IOT-REALM
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/IOT-REALM/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${KEYCLOAK_MEMORY_LIMIT:-768M}
          cpus: '1.0'
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-net

  # ── SERVIÇOS ──────────────────────────────────────────────────────────────────

  infra-executor:
    build: ./service-layer/infra-executor
    container_name: infra_executor
    ports:
      - "8089:8089"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INFRA_API_KEY: ${INFRA_API_KEY}
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    external: true

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  redis_streams_data:
  minio_data:
