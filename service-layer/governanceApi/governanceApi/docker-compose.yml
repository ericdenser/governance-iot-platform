services:
  govapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXY_ACTIVE: ${PROXY_ACTIVE:-false}
        PROXY_HOST: ${PROXY_HOST:-}
        PROXY_PORT: ${PROXY_PORT:-}
        PROXY_USER: ${PROXY_USER:-}
        PROXY_PASSWORD: ${PROXY_PASSWORD:-}
        HTTP_PROXY: ${PROXY_URL:-}
        HTTPS_PROXY: ${PROXY_URL:-}
    container_name: ${GOVAPI_CONTAINER_NAME:-govapi}
    ports:
      - "${GOVAPI_HOST_BIND:-0.0.0.0}:${GOVAPI_HOST_PORT:-8082}:8082"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${GOVAPI_DB:-cmdb_iot}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_STREAMS_HOST: ${REDIS_STREAMS_HOST:-redis-streams}
      REDIS_STREAMS_PORT: ${REDIS_STREAMS_PORT:-6379}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL}
      GOVAPI_CLIENT_ID: ${GOVAPI_CLIENT_ID:-gov-api}
      GOVAPI_CLIENT_SECRET: ${GOVAPI_CLIENT_SECRET}
      AGENT_MQTT_URL: ${AGENT_MQTT_URL:-http://agent-mqtt:8087}
      EVENT_HANDLER_URL: ${EVENT_HANDLER_URL:-http://event-handler:8085}
      GOVAPI_URL: ${GOVAPI_URL:-http://govapi:8082}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-firmware}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      NVS_PYTHON_PATH: ${NVS_PYTHON_PATH:-python3}
      NVS_SCRIPT_PATH: ${NVS_SCRIPT_PATH:-/opt/nvs_partition_gen.py}
      PROVISIONING_BOOTLOADER_BIN_PATH: ${PROVISIONING_BOOTLOADER_BIN_PATH:-/opt/provisioning-bins/bootloader.bin}
      PROVISIONING_PARTITION_TABLE_BIN_PATH: ${PROVISIONING_PARTITION_TABLE_BIN_PATH:-/opt/provisioning-bins/partition-table.bin}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    volumes:
      - ${PROVISIONING_BINS_VOLUME:-./provisioning-bins}:/opt/provisioning-bins:ro
    deploy:
      resources:
        limits:
          memory: ${GOVAPI_MEMORY_LIMIT:-640M}
          cpus: '1.0'
    restart: on-failure:5
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-app-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
