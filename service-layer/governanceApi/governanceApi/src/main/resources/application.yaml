server:
  port: 8082
  forward-headers-strategy: framework
  tomcat:
    # Maior que o IdleConnTimeout (90s) do http.Client Go do mosquitto-go-auth:
    # quem descarta a conexão keep-alive ociosa é o cliente, nunca o Tomcat no
    # meio de um reuso (EOF/connection reset nos callbacks /auth/mqtt-*).
    keep-alive-timeout: 120000

spring:
  servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
  data:                          
    redis:
      host: ${REDIS_STREAMS_HOST:localhost}
      port: ${REDIS_STREAMS_PORT:6380}
      # password: ${REDIS_STREAMS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${GOVAPI_DB:cmdb_iot}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client:
        registration:
          gov-api:
            client-id: ${GOVAPI_CLIENT_ID:gov-api}
            client-secret: ${GOVAPI_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          gov-api:
            token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token

mqtt:
  broker-url: mqtt://localhost:8883
  client-id: governance-api-publisher

agent:
  url: ${AGENT_MQTT_URL}

event:
  url: ${EVENT_HANDLER_URL}

govapi:
  self-url: ${GOVAPI_URL}

keycloak:
  url: ${KEYCLOAK_ADMIN_URL}

ota:
  max-firmware-size-mb: 4
  # TTL da presigned URL = base + waves * interval. wave-size e wave-interval-ms
  # devem espelhar broadcast do agent-mqtt.
  presign-base-ttl-min: 10
  wave-size: 50
  wave-interval-ms: 10000

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  region: ${MINIO_REGION}

app:
  hotstate:
    # Intervalo do HotStatePersistenceScheduler
    persist-interval-ms: 300000
  command:
    # Timeout default de comando (device sem deep_sleep no firmware)
    timeout-default-s: 300
    # Devices com deep_sleep: timeout = intervalo_deep_sleep * N + margem_s
    timeout-deep-sleep-cycles: 2
    timeout-deep-sleep-margin-s: 60
  streams:
    
    replica-id: ${REPLICA_ID:0}
    # Intervalo do sweeper que reivindica mensagens pendentes órfãs (XPENDING + XCLAIM)
    sweep-interval-ms: 60000

provisioning:
  nvs-python-path: ${NVS_PYTHON_PATH:python3}
  nvs-script-path: ${NVS_SCRIPT_PATH}
  nvs-partition-size: "0x5000"
  token-ttl-seconds: 86400
  # Intervalo em ms para o job de limpeza de devices fantasma (padrão: 5 min)
  cleanup-interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG

