server:
  port: 8087
  forward-headers-strategy: framework

mqtt:
  broker-url: tcp://${MQTT_BROKER_HOST:localhost}:${MQTT_BROKER_PORT:1883}
  # Reconecta (expires_in - margem) segundos após cada CONNECT, pro username
  # nunca carregar JWT vencido. Manter menor que o clockSkew do RestClientConfig.
  jwt-refresh-margin-s: ${MQTT_JWT_REFRESH_MARGIN_S:90}
  client-id: ${AGENT_MQTT_CLIENT_ID:agent-mqtt}
  topic: status/#
  error-topic: error/#
  telemetry-topic: telemetry/#
  password: unused

govapi:
  url: ${GOVAPI_URL:http://localhost:8082}

# Rollout em waves: broadcasts acima do threshold são fatiados em waves de
# wave-size devices, espaçadas por wave-interval-ms. Manter em sincronia com
# ota.wave-* do govApi (dimensiona o TTL da presigned URL).
broadcast:
  wave-threshold: ${BROADCAST_WAVE_THRESHOLD:1}
  wave-size: ${BROADCAST_WAVE_SIZE:1}
  wave-interval-ms: ${BROADCAST_WAVE_INTERVAL_MS:10000}

event-handler:
  url: ${EVENT_HANDLER_URL:http://localhost:8085}

datalogger:
  url: ${DATALOGGER_URL:http://localhost:8081}

spring:
  data:                          
    redis:
      host: ${REDIS_STREAMS_HOST:localhost}
      port: ${REDIS_STREAMS_PORT:6380}
      # password: ${REDIS_STREAMS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  application:
    name: agent-mqtt
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client:
        registration:
          govapi:
            client-id: ${AGENT_MQTT_CLIENT_ID:agent-mqtt}
            client-secret: ${AGENT_MQTT_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          govapi:
            token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token

# Expose /actuator/health pra docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # liveness: so verifica se JVM ta viva. Nao checa dependencias externas
      # (Redis/DB/etc), que fazem /actuator/health retornar 500 quando alguma
      # tem HealthIndicator com bug.
      probes:
        enabled: true
