x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  event-handler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXY_ACTIVE: ${PROXY_ACTIVE:-false}
        PROXY_HOST: ${PROXY_HOST:-}
        PROXY_PORT: ${PROXY_PORT:-}
        PROXY_USER: ${PROXY_USER:-}
        PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    container_name: ${EVENT_HANDLER_CONTAINER_NAME:-event-handler}
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${EVENT_HANDLER_DB:-event_handler}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_STREAMS_HOST: ${REDIS_STREAMS_HOST:-redis-streams}
      REDIS_STREAMS_PORT: ${REDIS_STREAMS_PORT:-6379}
      GOVAPI_URL: ${GOVAPI_URL:-http://govapi:8082}
    deploy:
      resources:
        limits:
          memory: ${EVENT_HANDLER_MEMORY_LIMIT:-512M}
          cpus: '0.5'
    restart: on-failure:5
    logging: *default-logging
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-app-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
