server:
  port: 8085
  forward-headers-strategy: framework

spring:
  application:
    name: event-handler
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${EVENT_HANDLER_DB:event_handler}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:                         
    redis:
      host: ${REDIS_STREAMS_HOST:localhost}
      port: ${REDIS_STREAMS_PORT:6380}
      # password: ${REDIS_STREAMS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

govapi:
  url: ${GOVAPI_URL:http://localhost:8082}

app:
  streams:
    # Identidade estável do consumer no grupo (sem PID) — herda o próprio PEL no restart.
    # Se escalar horizontal, cada réplica precisa de um REPLICA_ID distinto.
    replica-id: ${REPLICA_ID:0}
    # Intervalo do sweeper que reivindica mensagens pendentes órfãs (XPENDING + XCLAIM)
    sweep-interval-ms: 60000

# Configuração do webhook dispatcher
webhook:
  timeout-ms: 5000
  max-retries: 3
  retry-delay-ms: 2000

# Expose /actuator/health pra docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
