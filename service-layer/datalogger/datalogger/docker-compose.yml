x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  datalogger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXY_ACTIVE: ${PROXY_ACTIVE:-false}
        PROXY_HOST: ${PROXY_HOST:-}
        PROXY_PORT: ${PROXY_PORT:-}
        PROXY_USER: ${PROXY_USER:-}
        PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    container_name: ${DATALOGGER_CONTAINER_NAME:-datalogger}
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-mackenzie}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry_bucket}
      REDIS_STREAMS_HOST: ${REDIS_STREAMS_HOST:-redis-streams}
      REDIS_STREAMS_PORT: ${REDIS_STREAMS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${DATALOGGER_MEMORY_LIMIT:-448M}
          cpus: '0.5'
    restart: on-failure:5
    logging: *default-logging
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-app-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
