spring:

  application:
    name: bff

  threads:
    virtual:
      enabled: true

  mvc:
    async:
      request-timeout: -1

  data:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${BFF_CLIENT_ID:iot-bff}
            client-secret: ${BFF_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        # Explicit endpoints instead of issuer discovery: the browser uses the public
        # URL, server-side calls stay on the docker network (KEYCLOAK_INTERNAL_ISSUER_URI).
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_INTERNAL_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_INTERNAL_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_INTERNAL_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}/protocol/openid-connect/userinfo
            user-name-attribute: sub

  session:
    store-type: redis
    timeout: 30m

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 10MB
app:
  frontend-url: ${FRONTEND_URL}
  keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI}
  keycloak-internal-issuer-uri: ${KEYCLOAK_INTERNAL_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}
  gov-api-url: ${GOVAPI_URL}
  keycloak-admin-url: ${KEYCLOAK_ADMIN_URL}
  session:
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
    cookie-same-site: ${APP_SESSION_COOKIE_SAME_SITE:Lax}
    cookie-path: ${APP_SESSION_COOKIE_PATH:/}
    # Other apps on a shared domain also use SESSION/XSRF-TOKEN
    cookie-name: ${APP_SESSION_COOKIE_NAME:SESSION}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.security.oauth2: ${LOG_LEVEL_OAUTH:WARN}
    org.springframework.session: WARN
    org.springframework.data.redis: WARN
    org.springframework.web.servlet.DispatcherServlet: DEBUG

# Expose /actuator/health pra docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # liveness: so verifica se JVM ta viva. Nao checa dependencias externas
      # (Redis/DB/etc), que fazem /actuator/health retornar 500 quando alguma
      # tem HealthIndicator com bug.
      probes:
        enabled: true
