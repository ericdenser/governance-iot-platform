x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXY_ACTIVE: ${PROXY_ACTIVE:-false}
        PROXY_HOST: ${PROXY_HOST:-}
        PROXY_PORT: ${PROXY_PORT:-}
        PROXY_USER: ${PROXY_USER:-}
        PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    container_name: ${BFF_CONTAINER_NAME:-bff}
    ports:
      - "${BFF_HOST_BIND:-0.0.0.0}:${BFF_HOST_PORT:-8083}:8083"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      REDIS_SESSION_HOST: ${REDIS_SESSION_HOST:-redis}
      REDIS_SESSION_PORT: ${REDIS_SESSION_PORT:-6379}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL}
      BFF_CLIENT_ID: ${BFF_CLIENT_ID:-iot-bff}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BFF_PUBLIC_URL: ${BFF_PUBLIC_URL:-http://localhost:8083}
      GOVAPI_URL: ${GOVAPI_URL:-http://govapi:8082}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-Lax}
      APP_SESSION_COOKIE_PATH: ${APP_SESSION_COOKIE_PATH:-/}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BFF_MEMORY_LIMIT:-512M}
          cpus: '0.5'
    restart: on-failure:5
    logging: *default-logging
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-app-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
