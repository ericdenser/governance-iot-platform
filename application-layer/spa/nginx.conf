# Extrai a porta do Host header (ex: "172.16.39.12:8090" -> "8090").
# Necessário pro X-Forwarded-Port porque o nginx do container escuta 80
# mas o binding externo pode ser outro. Sem isso, Spring com
# forward-headers-strategy=framework assume porta 80 e strippa do baseUrl,
# quebrando redirect_uri do OAuth2.
map $http_host $forwarded_port {
    default                 "80";
    "~^[^:]+:(?<port>\d+)$" $port;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Upload de firmware — default nginx é 1M, insuficiente pro app.bin
    # do ESP32-S3 (~1-4MB) + margem pra binaries maiores.
    client_max_body_size 20M;

    # Docker embedded DNS — nginx normalmente resolve upstream só no startup;
    # o resolver permite lazy DNS lookup, sobrevive a restart/rebuild do BFF.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTP/1.1 pro upstream (default é HTTP/1.0, que não suporta
    # Transfer-Encoding: chunked usado pelo Spring). Connection "" limpa
    # o header pra keep-alive funcionar.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Endpoints REST do BFF (SPA usa axios com baseURL='/api')
    # rewrite explícito remove o prefix /api/ antes do proxy_pass.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://iot-bff:8083\;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
        # SSE relay (event-handler → BFF → SPA)
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Fluxo OAuth2 do Spring Security no BFF (sem strip de prefix)
    location /oauth2/ {
        proxy_pass http://iot-bff:8083\;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    location /login/ {
        proxy_pass http://iot-bff:8083\;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    location /logout {
        proxy_pass http://iot-bff:8083\;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    # Client-side routing do SPA (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
