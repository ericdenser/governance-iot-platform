server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — nginx normalmente resolve upstream só no startup;
    # com resolver + variável no proxy_pass, força lookup dinâmico em cada
    # request (sobrevive a restart/rebuild do BFF).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Endpoints REST do BFF (SPA usa axios com baseURL='/api')
    # Trailing slash no proxy_pass strippa o prefixo /api/ ao encaminhar.
    location /api/ {
        set $bff_upstream "iot-bff:8083";
        proxy_pass http://$bff_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # SSE relay (event-handler → BFF → SPA)
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Fluxo OAuth2 do Spring Security no BFF (sem strip)
    location /oauth2/ {
        set $bff_upstream "iot-bff:8083";
        proxy_pass http://$bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /login/ {
        set $bff_upstream "iot-bff:8083";
        proxy_pass http://$bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /logout {
        set $bff_upstream "iot-bff:8083";
        proxy_pass http://$bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Client-side routing do SPA (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
