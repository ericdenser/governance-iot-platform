# Extrai a porta do Host header do request (ex: "172.16.39.12:8090" → "8090").
# Necessário pro X-Forwarded-Port porque o nginx do container escuta na 80
# mas o binding externo pode ser outro (ex: 8090). Sem isso, Spring com
# forward-headers-strategy=framework assume porta 80 e strippa do baseUrl,
# quebrando o redirect_uri do OAuth2.
map $http_host $forwarded_port {
    default                 "80";
    "~^[^:]+:(?<port>\d+)$" $port;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoints REST do BFF (SPA usa axios com baseURL='/api')
    # rewrite explícito remove o prefix /api/ antes do proxy_pass.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://iot-bff:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
        # SSE relay (event-handler → BFF → SPA)
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Fluxo OAuth2 do Spring Security no BFF (sem strip de prefix)
    location /oauth2/ {
        proxy_pass http://iot-bff:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    location /login/ {
        proxy_pass http://iot-bff:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    location /logout {
        proxy_pass http://iot-bff:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_cookie_path / /;
    }

    # Client-side routing do SPA (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
