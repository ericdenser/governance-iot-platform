x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# nginx master runs as root on port 80: keeps only what it needs to bind and drop to the worker user
x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - NET_BIND_SERVICE

services:
  spa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROXY_URL: ${NPM_PROXY_URL:-}
        NPM_NO_PROXY: ${NPM_NO_PROXY:-localhost,127.0.0.1}
        VITE_BFF_URL: ${BFF_PUBLIC_URL:-http://localhost:8083}
        VITE_BASE_PATH: ${SPA_BASE_PATH:-/}
        VITE_CARTO_API_KEY: ${CARTO_API_KEY:-}
    container_name: ${SPA_CONTAINER_NAME:-spa}
    ports:
      - "${SPA_HOST_BIND:-0.0.0.0}:${SPA_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${SPA_MEMORY_LIMIT:-64M}
          cpus: '0.25'
          pids: 64
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-app-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
